services:
  db:
    image: mysql:8.0
    container_name: inquiry-management-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inquiry_management
      MYSQL_USER: inquiry_user
      MYSQL_PASSWORD: inquiry_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - inquiry-management-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inquiry-management-db-data:
